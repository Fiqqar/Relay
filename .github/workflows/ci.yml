name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -q

      - name: Smoke test the CLI entry point
        run: relay --version

      - name: Smoke test --help
        run: relay --help

      - name: sdist + wheel build
        run: python -m build

      - name: Installed wheel works standalone
        run: |
          pip install --no-deps --force-reinstall dist/relay_cli-*.whl
          relay --version
        shell: bash