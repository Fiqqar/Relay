name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bootstrap Environment
        uses: ./.github/actions/bootstrap

      - name: Static analysis (Ruff)
        run: ruff check .

      - name: Type checking (MyPy)
        run: mypy relay

      - name: Dependency vulnerability scan
        run: |
          pip install --disable-pip-version-check "pip-audit>=2.7,<3"
          pip-audit --strict .
          # Project-path mode only resolves the (intentionally empty)
          # runtime closure — environment mode audits the build/test/lint
          # toolchain actually installed in this job. No --strict here:
          # --strict fails on any unresolvable dist, including our own
          # editable self-install; --skip-editable drops just that one.
          python -m pip_audit --skip-editable

      - name: Security scan (Bandit)
        run: |
          pip install --disable-pip-version-check "bandit>=1.7,<2"
          bandit -r relay -ll

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: static-analysis
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bootstrap Environment
        uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite with the coverage gate
        run: pytest -q --cov --cov-report=term

      - name: Smoke test the CLI entry point
        run: |
          relay --version
          relay --help

  build:
    name: build wheel & isolated smoke test
    runs-on: ubuntu-latest
    needs: static-analysis
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Isolated Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install --disable-pip-version-check "build>=1.2,<2"

      - name: Clean dist
        run: rm -rf dist build *.egg-info

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Isolated wheel smoke test
        run: |
          python -m venv "${RUNNER_TEMP}/smoke-env"
          "${RUNNER_TEMP}/smoke-env/bin/pip" install --no-deps dist/relay_cli-*.whl
          (
            cd "${RUNNER_TEMP}"
            "${RUNNER_TEMP}/smoke-env/bin/relay" --version
            "${RUNNER_TEMP}/smoke-env/bin/relay" --help
          )

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: static-analysis
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bootstrap Environment
        uses: ./.github/actions/bootstrap

      - name: Run the end-to-end test (POSIX)
        if: runner.os != 'Windows'
        run: bash e2e_test.sh

      - name: Run the end-to-end test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e_test.ps1

      - name: Fail on unsupported OS
        if: runner.os != 'Linux' && runner.os != 'macOS' && runner.os != 'Windows'
        run: |
          echo "::error::No e2e script is wired up for runner.os '${{ runner.os }}' - add one or update the matrix."
          exit 1
        shell: bash
