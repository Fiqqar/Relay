name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Run the test suite with the coverage gate
        run: pytest -q --cov --cov-report=term

      - name: Static analysis
        run: ruff check .

      - name: Type checking
        run: mypy relay

      - name: Smoke test the CLI entry point
        run: relay --version

      - name: Smoke test --help
        run: relay --help

      - name: sdist + wheel build
        run: python -m build

      - name: Installed wheel works standalone
        run: |
          pip install --no-deps --force-reinstall dist/relay_cli-*.whl
          relay --version
        shell: bash

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - name: Run the end-to-end test (POSIX)
        if: runner.os == 'Linux'
        run: bash e2e_test.sh

      - name: Run the end-to-end test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e_test.ps1