name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Static analysis
        run: ruff check .

      - name: Type checking
        run: mypy relay

      - name: Dependency vulnerability scan
        run: pip install "pip-audit>=2.7,<3" && pip-audit --strict .

      - name: Security scan
        run: pip install "bandit>=1.7,<2" && bandit -r relay -ll

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: static-analysis
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Run the test suite with the coverage gate
        run: pytest -q --cov --cov-report=term

      - name: Smoke test the CLI entry point
        run: relay --version

      - name: Smoke test --help
        run: relay --help

  build:
    name: build wheel
    runs-on: ubuntu-latest
    needs: static-analysis
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Clean dist
        run: rm -rf dist build *.egg-info

      - name: sdist + wheel build
        run: python -m build

      - name: Installed wheel works standalone
        run: |
          pip install --no-deps --force-reinstall dist/relay_cli-*.whl
          relay --version
        shell: bash

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: static-analysis
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - name: Run the end-to-end test (POSIX)
        if: runner.os != 'Windows'
        run: bash e2e_test.sh

      - name: Run the end-to-end test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e_test.ps1

      - name: Fail on unsupported OS
        if: runner.os != 'Linux' && runner.os != 'macOS' && runner.os != 'Windows'
        run: |
          echo "::error::No e2e script is wired up for runner.os '${{ runner.os }}' - add one or update the matrix."
          exit 1
        shell: bash
