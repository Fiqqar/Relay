name: Release

# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# SECURITY: This workflow has contents: write and must never gain a pull_request
# trigger without re-reviewing the permissions block — it only runs on tag-push
# / workflow_dispatch, never on fork PRs.

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: build ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/bootstrap

      - name: Test suite must pass
        run: pytest -q

      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit --strict .

      - name: Clean dist
        run: rm -rf dist build *.egg-info

      - name: Build sdist + wheel
        run: python -m build

      - name: Smoke-test the built wheel
        run: |
          pip install --no-deps --force-reinstall dist/relay_cli-*.whl
          relay --version
        shell: bash

      - name: Generate SBOM (shipped artifact only)
        run: |
          pip install cyclonedx-bom
          python -m venv /tmp/sbom-env
          /tmp/sbom-env/bin/pip install --no-deps dist/relay_cli-*.whl
          cyclonedx-py environment /tmp/sbom-env -o dist/relay-sbom.cdx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  attest-and-publish:
    name: attest & publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
