name: Release

# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# SECURITY: This workflow has contents: write and must never gain a pull_request
# trigger without re-reviewing the permissions block — it only runs on tag-push
# / workflow_dispatch, never on fork PRs.

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Isolated Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Test and Build Dependencies
        run: pip install --disable-pip-version-check ".[dev]" "pip-audit>=2.7,<3" "cyclonedx-bom>=5.0,<8"

      - name: Test suite must pass
        run: pytest -q

      - name: Verify Scoop manifest does not have dummy hash
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path('bucket/relay.json').read_text('utf-8'))
          raw_hash = manifest.get('hash', '').removeprefix('sha256:').lower()
          if not raw_hash or set(raw_hash) == {'0'} or len(raw_hash) != 64:
              print(f'::error file=bucket/relay.json::Release blocked: Scoop manifest has dummy or invalid hash ({manifest.get(\"hash\")!r}). Update bucket/relay.json with a valid SHA256 checksum before release.', file=sys.stderr)
              sys.exit(1)
          "

      - name: Dependency vulnerability scan
        run: pip-audit --strict .
      - name: Installed-toolchain vulnerability scan
        # Project-path mode only resolves the (intentionally empty)
        # runtime closure — environment mode audits the build/test/lint
        # toolchain actually installed in this job. No --strict here:
        # --strict fails on any unresolvable dist, including our own
        # editable self-install; --skip-editable drops just that one.
        run: python -m pip_audit --skip-editable

      - name: Clean dist
        run: rm -rf dist build *.egg-info

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel --outdir dist/

      - name: Isolated wheel smoke test
        run: |
          python -m venv "${RUNNER_TEMP}/smoke-env"
          "${RUNNER_TEMP}/smoke-env/bin/pip" install --no-deps dist/relay_cli-*.whl
          (
            cd "${RUNNER_TEMP}"
            "${RUNNER_TEMP}/smoke-env/bin/relay" --version
          )

      - name: Generate SBOM (shipped artifact only)
        run: |
          python -m venv "${RUNNER_TEMP}/sbom-env"
          "${RUNNER_TEMP}/sbom-env/bin/pip" install --no-deps dist/relay_cli-*.whl
          cyclonedx-py environment "${RUNNER_TEMP}/sbom-env" -o dist/relay-sbom.cdx.json

      - name: Generate SHA256 checksums
        run: |
          (
            cd dist
            sha256sum * > SHA256SUMS
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  attest-and-publish:
    name: attest & publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release via Native Toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists; updating assets..."
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi
