[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-cli"
version = "1.0.1"
description = "Your Git workflow, on autopilot: AI Conventional Commits with a manual fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Zero runtime dependencies on purpose: the whole tool uses only the stdlib,
# so `pip install .` succeeds anywhere, including fully offline machines.
dependencies = []

[project.optional-dependencies]
# Dev-only extras used for testing, linting, type checking, and release
# packaging. Not needed to run Relay itself.
# NOTE: keep single-line arrays — Relay's own TOML parser is a subset parser
# and does not support multi-line array values.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "build>=1.0"]

[project.scripts]
relay = "relay.cli:main"

[tool.setuptools]
packages = ["relay", "relay.ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["relay"]
branch = true
omit = ["relay/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
packages = ["relay"]
ignore_missing_imports = true
no_implicit_optional = true
